# Electronic excitations
excitation: exciton             # [exciton] 
restart: from_scratch         # [from_scratch|" "]
material: 3D                  # ["3D"|"2D"|"1D"|"0D"]
bse: 
  method: tb                    # [dft|tb]
  tb:
    bands:                      
      engine: wannier90
      file: hBN.bands # not read anyway
      vb_idx: [0,1] # valence band index, counting from 0
      vb_skip: 0
      cb_idx: [1,2] # lowest conduction band index => 5th band, but index of 4
      cb_skip: 0
    cnmk:
      engine: wannier90
      file: hBN.cnmk # # not read anyway
      vb_idx: [0,1] # valence band indices, counting from 0
      vb_skip: 0
      cb_idx: [1,2] # conduction band indices
      cb_skip: 0
    kgrid: [18, 18, 1] #k-points mesh

  wannier_io:
    engine: wannier90
    hr_file: H_r_filtered.dat
    wsvec_file: hBN_wsvec.dat
    win_file: hBN.win
    wout_file: hBN.wout
    wf_location: atom_centered   # [atom_centered|nearest_atom|wf_centered]
    using_mlwf: false

  Qpoints:
    hspoints: [[0.0, 0.0, 0.0]] # Gamma point
    num_points: 1

# Screened electron-hole interaction
eh_interaction:
  space: real                # [real|reciprocal]
  real:
    potential: Keldysh       # [keldysh|unknown]
    layer: monolayer         # [monolayer|bilayer|trilayer]
    type: analytic             # [analytic]
    epsilon_t: 1.0           # top_dielectric
    epsilon_b: 1.0           # bottom dielectric
    rho0: 10                 # screening length of 10 A, from paper
    a0: 1.45 
    zav: 0.0
  include:
    direct: true               # Include direct term
    exchange: true            # Include exchange term
    screen_exchange: false

# Absorption spectra
Absorption:               # 
  spin: unpolarized          # [unpolarized|polarized|spinorbit]
  spinorbit:
    type: perturbation       # [perturbation|full]
    unfold: false            # [true|false]
#    m2u_map_file: Moire2unit.hdf5 
    delta_soc_file: DELTA.hdf5
    band_file_unpolarized: hBN_unit_unpolar.bands
    band_file_soc: hBN_unit.bands
  photon_energy:
    min: -0.5            # in eV (relative to minimum)
    max: 6.0               # in eV 
    step: 0.005             # energy spacing
    sigma: 0.025       # Gaussian broadening

# Diagonalization
diagonalize:
  library: lapack       # [lapack|elpa|petsc/slepc]
                        # For elpa, run separately.

# System architecture
system: cpu               # [cpu|gpu]
cpu:
  multithreading: true    # Use multithreading
gpu:
  streams: 4              # 

# IO options
io:
  exciton_hamiltonian_file: H_exciton_tb.hdf5       
  exciton_eigenval_file: Eigval_exciton_tb.hdf5
  exciton_eigenvec_file: Eigvec_exciton_tb.hdf5
  exciton_conductivity_file: Conductivity_exciton_tb.hdf5
  exciton_wfn_rh_file: Exciton_rh_tb.hdf5  
